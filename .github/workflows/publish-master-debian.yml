name: Build Debian Package

# 持续交付（当前阶段）：仅手动触发。
# 在 Actions 页面点击 “Run workflow” 时，由触发者决定是否保留构建产物。
on:
  workflow_dispatch:
    inputs:
      retain_artifact:
        description: '是否保留 .deb 构建产物（上传为 Actions Artifact）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# 同一个分支只允许一个构建，避免重复打包任务并行
concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest

    steps:
      # 拉取触发本次工作流时选中的分支/提交
      - name: Checkout
        uses: actions/checkout@v4

      # build-deb.sh 依赖 JDK 25（含 jpackage / jlink）
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jpackage 生成 deb 需要 fakeroot、dpkg-deb；jmods 解压需要 unzip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot unzip
          java -version
          mvn -version
          jpackage --version

      # 读取项目版本，供后续产物命名与摘要使用
      - name: Read project version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::无法从 pom.xml 解析版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "项目版本: $VERSION"

      # JavaFX jmods 不在 Maven Central，按 pom.xml 中的 javafx.version 下载
      - name: Download JavaFX jmods
        run: |
          set -euo pipefail
          JFX_VERSION="$(sed -n 's:.*<javafx.version>\(.*\)</javafx.version>.*:\1:p' pom.xml | head -1)"
          if [[ -z "$JFX_VERSION" ]]; then
            echo "::error::无法从 pom.xml 解析 javafx.version"
            exit 1
          fi
          echo "JavaFX jmods 版本: $JFX_VERSION"
          URL="https://download2.gluonhq.com/openjfx/${JFX_VERSION}/openjfx-${JFX_VERSION}_linux-x64_bin-jmods.zip"
          curl -fSL --retry 3 --retry-delay 5 -o javafx-jmods.zip "$URL"
          unzip -q javafx-jmods.zip -d .
          # 校验解压结果，build-deb.sh 会自动探测根目录下的 javafx-jmods-*
          test -f "javafx-jmods-${JFX_VERSION}/javafx.controls.jmod"

      # 复用仓库根目录的打包脚本，保持 CI 与本地构建一致
      - name: Build .deb
        run: |
          set -euo pipefail
          chmod +x build-deb.sh
          ./build-deb.sh
          ls -lh package/*.deb

      # 仅当触发时勾选“保留产物”才上传 Artifact
      - name: Upload .deb artifact
        if: inputs.retain_artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeworkchecker-deb-${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: package/*.deb
          if-no-files-found: error
          retention-days: 30

      # 无论是否保留产物，都在 Job 摘要中记录构建信息
      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RETAIN_ARTIFACT: ${{ inputs.retain_artifact }}
        run: |
          {
            echo "### HomeworkChecker .deb"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 项目版本 | \`${VERSION:-未知}\` |"
            echo "| 保留产物 | \`${RETAIN_ARTIFACT:-false}\` |"
            echo "| 触发提交 | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
