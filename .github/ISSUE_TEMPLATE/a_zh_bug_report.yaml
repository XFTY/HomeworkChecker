name: 软件 Bug 反馈
description: 向开发者反馈软件错误
title: "[Bug]: "
labels: ["bug", "新提交"]
assignees:
  - XFTY
body:
  - type: markdown
    attributes:
      value: |
        感谢您向 HomeworkChecker 开发者提交故障反馈，我们对此表示诚挚的谢意。

        **在开始填写之前，建议您提前准备以下材料：**
        - 您当前使用的 HomeworkChecker 版本号（可在「关于」页面查看）
        - 您的操作系统及版本（如 Windows 11 23H2、Ubuntu 24.04）
        - 可稳定复现问题的操作步骤
        - 问题现象截图或录屏（如有）
        - 相关错误日志或异常提示（如有）

        请尽量如实、完整地填写下列信息，以便我们更快地定位并解决问题。

  - type: input
    id: Bug-Description
    attributes:
      label: 软件异常/故障描述
      description: 请简要说明您所遇到的软件故障现象。
      placeholder: 请在此处输入
    validations:
      required: true

  - type: textarea
    id: To-Reproduce
    attributes:
      label: 问题复现步骤
      description: |
        请描述问题的具体复现步骤，以便开发者能够准确重现。
        如条件允许，您也可以附上相关截图或录屏链接。

      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……问题
    validations:
      required: true

  - type: input
    id: Expected-Behavior
    attributes:
      label: 软件预期行为
      description: 在按照上述步骤操作后，您期望软件呈现怎样的结果？
      placeholder: 请在此处输入
    validations:
      required: true

  - type: input
    id: HC-Version
    attributes:
      label: HomeworkChecker 版本
      description: |
        请填写您当前运行的具体版本号（可在「关于」页面查看）。
        建议您优先反馈最新版本中的问题，旧版本的问题可能无法及时受理。

      placeholder: 例如：1.7.0-Beta
    validations:
      required: true

  - type: textarea
    id: Additional-Context
    attributes:
      label: 补充信息
      description: 若还有其他需要说明的信息，请在此处补充。
      placeholder: 请在此处输入
    validations:
      required: false
