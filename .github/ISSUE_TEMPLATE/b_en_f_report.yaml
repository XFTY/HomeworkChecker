name: Feature Request
description: Suggest new features to the developer
title: "[Feature Request]: "
labels: ["enhancement", "新提交"]
assignees:
  - XFTY
body:
  - type: markdown
    attributes:
      value: |
        Thank you for providing us with your valuable suggestions and recommendations.
        We value every suggestion you make, as they help us continually improve HomeworkChecker.

        **Before you begin, please have the following materials ready:**
        - A clear description of the new feature you would like to see and its expected effect
        - The use cases and practical requirements behind it
        - Why the existing features cannot meet your needs (if applicable)
        - Any reference examples, sketches, or screenshots (if available)

        Please describe your idea as clearly as possible so that we can understand your needs accurately.

  - type: input
    id: Feature-Idea
    attributes:
      label: New Feature Suggestion
      description: Please describe in detail the new feature you would like us to add.
      placeholder: Please enter here
    validations:
      required: true

  - type: textarea
    id: Use-Cases
    attributes:
      label: Use Cases
      description: Please describe how this new feature would be used and what specific use cases it covers.
      placeholder: Please enter here
    validations:
      required: true

  - type: input
    id: Benefits
    attributes:
      label: Benefits Provided
      description: What benefits would implementing this new feature bring to users?
      placeholder: Please enter here
    validations:
      required: true

  - type: dropdown
    id: Priority
    attributes:
      label: Feature Priority
      description: How important do you consider this feature to be?
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: Alternative-Solutions
    attributes:
      label: Alternative Solutions
      description: Are there other ways or existing features that can achieve a similar effect?
      placeholder: Please enter here
    validations:
      required: false

  - type: textarea
    id: Additional-Context
    attributes:
      label: Additional Information
      description: If there is any other related information you would like to add, please specify it here.
      placeholder: Please enter here
    validations:
      required: false
