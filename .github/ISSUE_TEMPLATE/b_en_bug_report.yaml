name: Bug Report
description: Report software bugs to the developer
title: "[Bug]: "
labels: ["bug", "新提交"]
assignees:
  - XFTY
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report to the HomeworkChecker developers. We truly appreciate your contribution.

        **Before you begin, please have the following materials ready:**
        - The HomeworkChecker version you are currently using (available on the "About" page)
        - Your operating system and version (e.g., Windows 11 23H2, Ubuntu 24.04)
        - The steps that reliably reproduce the issue
        - Screenshots or screen recordings of the issue (if available)
        - Relevant error logs or exception messages (if available)

        Please fill in the information below as completely and accurately as possible so that we can locate and resolve the issue more quickly.

  - type: input
    id: Bug-Description
    attributes:
      label: Software Exception/Fault Description
      description: Please briefly describe the software fault you encountered.
      placeholder: Please enter here
    validations:
      required: true

  - type: textarea
    id: To-Reproduce
    attributes:
      label: Steps to Reproduce the Issue
      description: |
        Please describe the detailed steps to reproduce the issue so that the developer can reproduce it accurately.
        If possible, you may also attach relevant screenshots or screen recordings.

      placeholder: |
        1. Open ...
        2. Click ...
        3. The issue occurs ...
    validations:
      required: true

  - type: input
    id: Expected-Behavior
    attributes:
      label: Expected Software Behavior
      description: After following the steps above, what result did you expect the software to produce?
      placeholder: Please enter here
    validations:
      required: true

  - type: input
    id: HC-Version
    attributes:
      label: HomeworkChecker Version
      description: |
        Please enter the exact version you are currently running (available on the "About" page).
        We recommend reporting issues against the latest version; issues on older versions may not be addressed in a timely manner.

      placeholder: e.g., 1.7.0-Beta
    validations:
      required: true

  - type: textarea
    id: Additional-Context
    attributes:
      label: Additional Information
      description: If there is anything else you would like to clarify, please add it here.
      placeholder: Please enter here
    validations:
      required: false
